<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script defer src="js/main.js"></script>
    <title>Basic Quiz Site</title>
  </head>
  <body>
    <div class="quiz-container" id="start-screen">
      <h1 class="start-title">Welcome to the Basic Quiz Site</h1>
      <p class="start-description">Click the button below to start the quiz.</p>
      <button class="start-button" id="start-button">Start Quiz</button>
    </div>
    <div class="quiz-layout hidden" id="question-screen">
      <div class="question-header">
        <p class="question-counter" id="question-counter"></p>
        <p class="header-score" id="header-score"></p>
      </div>
      <div class="progress-dots" id="progress-dots"></div>
      <div class="quiz-container question-card">
        <p class="question-text" id="question-text"></p>
        <div class="answer-buttons">
          <button class="answer-button" id="answer-button-1">
            <span></span>
          </button>
          <button class="answer-button" id="answer-button-2">
            <span></span>
          </button>
          <button class="answer-button" id="answer-button-3">
            <span></span>
          </button>
          <button class="answer-button" id="answer-button-4">
            <span></span>
          </button>
        </div>
      </div>
    </div>
    <div class="quiz-container hidden" id="results-screen">
      <h1 class="score-title">Well Done for Completing the Quiz!</h1>
      <p class="score-value" id="score"></p>
      <button class="start-button" id="restart-button">Restart Quiz</button>
    </div>
  </body>
</html>
