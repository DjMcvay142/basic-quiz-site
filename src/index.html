<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Basic Quiz Site</title>
  </head>
  <body>
    <h1>Basic Quiz Site</h1>
    <div class="quiz-container" id="start-screen">
      <h1 class="start-title">Welcome to the Basic Quiz Site</h1>
      <p class="start-description">Click the button below to start the quiz.</p>
      <button class="start-button" id="start-button">Start Quiz</button>
    </div>
    <div class="quiz-container" id="question-screen">
      <h1 class="question-title">Question 1</h1>
      <p class="question-text">What is the capital of France?</p>
      <div class="answer-buttons">
        <button class="answer-button">Berlin</button>
        <button class="answer-button">Madrid</button>
        <button class="answer-button">Paris</button>
        <button class="answer-button">Rome</button>
      </div>
    </div>
  </body>
  <script src="src/js/script.js"></script>
</html>
