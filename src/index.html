<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Basic Quiz Site</title>
  </head>
  <body>
    <h1>Basic Quiz Site</h1>
    <div class="quiz-container" id="start-screen">
      <h1 class="start-title">Welcome to the Basic Quiz Site</h1>
      <p class="start-description">Click the button below to start the quiz.</p>
      <button class="start-button" id="start-button">Start Quiz</button>
    </div>
    <div class="quiz-container hidden" id="question-screen">
      <h1 class="question-title" id="question-title">Question 1</h1>
      <p class="question-text" id="question-text">
        What is the capital of France?
      </p>
      <div class="answer-buttons">
        <button class="answer-button" id="answer-button-1">""</button>
        <button class="answer-button" id="answer-button-2">""</button>
        <button class="answer-button" id="answer-button-3">""</button>
        <button class="answer-button" id="answer-button-4">""</button>
      </div>
    </div>
    <div class="quiz-container hidden" id="results-screen">
      <h1 class="score-title">Well Done for Completing the Quiz!</h1>
      <p class="score-value" id="score"></p>
      <button class="start-button" id="restart-button">Restart Quiz</button>
    </div>
  </body>
  <script src="js/main.js"></script>
</html>
